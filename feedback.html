<body>

    <header>

<main>
<h2 id="feedback">Share Your Feedback</h2>
<p id="feedback"> Please fill in the form below to share your thoughts about the course and portal.</p>
<form>
    <label for="name">Name</label><br>
    <input type="text" id="name" placeholder="Your Beautiful Name">
     <br>
     <label for="email">Email</label><br>
     <input type="email" id="email" placeholder="Your Email">
     <br>
     <label for="phone">Phone</label><br>
     <input type="tel" id="phone" placeholder="Your Phone No.">
     <br>
     <b>Gender:</b><br>

    <label for="1">
        <input type="radio" value="Male" name="gender"id="1">Male
    </label>
    <label for="2">
        <input type="radio" value="Female" name="gender" id="2">Female
        </label>
        <label for="3">
        <input type="radio" value="Other" name="gender" id="3">Other
</label>
<br>
<br>
<label for="course" >Select Course</label>
<br>
<select name="course" id="course" >
    <option>--Select Rating--</option>
    <option>Foundation of It</option>
    <option>Database Management System</option>
    <option>Problem-solving</option>
    <option>Environmental Studies</option>
    <option>New Age life Skills</option>
</select>
<br>
<label for="Feedback" > Your Feedback:</label><br>
<textarea name="Feedback" id="Feedback" placeholder="Please Give Your Valuable Feedback" rows="5"></textarea>
<br>
<label for="Rating" >Please Rate the Portal:</label>
<select name="Rating" id="Rating" >
    <option>--Select Rating--</option>
    <option>5-Excellent</option>
    <option>4-Good</option>
    <option>3-Average</option>
    <option>2-fair</option>
    <option>1-poor</option>
</select>
<br>
<label for="subscribe"> Subscribe to newsletters and updates.</label>
<input type="checkbox" id="subscribe" Value="subscribe" name="subscribe">
<br>
<button type="submit">Submit</button>
<button type="reset">Reset</button>

</form>
</main>
<footer><p>©2026 Student Portal. All rights reserved.</p></footer>
</body>
</html>
